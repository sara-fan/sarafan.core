name: sarafan-core

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SARAFAN_POSTGRES_DB:-sarafan}
      POSTGRES_USER: ${SARAFAN_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SARAFAN_POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SARAFAN_POSTGRES_USER:-postgres} -d ${SARAFAN_POSTGRES_DB:-sarafan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
     - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${SARAFAN_ADMINER_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/Sarafan.Core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${SARAFAN_POSTGRES_DB:-sarafan};Username=${SARAFAN_POSTGRES_USER:-postgres};Password=${SARAFAN_POSTGRES_PASSWORD:-postgres}
      Authentication__SigningKey: ${SARAFAN_JWT_SECRET:-sarafan-development-signing-key-change-before-deployment}
      Authentication__SecureCookies: "false"
      BackofficeAuthentication__SigningKey: ${SARAFAN_BACKOFFICE_JWT_SECRET:-sarafan-backoffice-development-signing-key-change-before-deployment}
      BackofficeAuthentication__SecureCookies: "false"
      BackofficeBootstrap__Enabled: false
      # For a one-time local bootstrap 
      # DO NOT TRACK/COMMIT
      # BackofficeBootstrap__Enabled: true
      # BackofficeBootstrap__Email: "The first admin e-mail"
      # BackofficeBootstrap__Password: "The first admin password"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/status/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  tests:
    build:
      context: .
      dockerfile: src/Sarafan.Core/Dockerfile
      target: test
      args:
        BUILD_CONFIGURATION: Release
    profiles:
      - test
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SARAFAN_TEST_POSTGRES: Host=db;Port=5432;Database=postgres;Username=${SARAFAN_POSTGRES_USER:-postgres};Password=${SARAFAN_POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./TestResults:/test-results
    command:
      - dotnet
      - test
      - ./tests/Sarafan.Core.Tests/Sarafan.Core.Tests.csproj
      - --configuration
      - Release
      - --no-build
      - --no-restore
      - --verbosity
      - normal
      - --logger
      - "trx;LogFileName=sarafan-core-tests.trx"
      - --collect
      - "XPlat Code Coverage"
      - --results-directory
      - /test-results

volumes:
  pgdata:
