services:
  backoffice:
    build:
      context: ../sarafan.back.office
    environment:
      SARAFAN_BACKOFFICE_LOGGING_ENABLED: ${SARAFAN_BACKOFFICE_LOGGING_ENABLED:-false}
    ports:
      - "127.0.0.1:${SARAFAN_BACKOFFICE_PORT:-8083}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
