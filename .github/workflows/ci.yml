name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-latest
    env:
      SARAFAN_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
      SARAFAN_POSTGRES_DATA_DIR: ${{ github.workspace }}/.ci-pgdata
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Sarafan.sln

      - name: Verify formatting
        run: dotnet format Sarafan.sln --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Sarafan.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test Sarafan.sln
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Upload coverage reports to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build and start container
        run: |
          mkdir -p "$SARAFAN_POSTGRES_DATA_DIR"
          docker compose up --detach --build --wait

      - name: Check API
        run: curl --fail --silent --show-error http://localhost:8080/api/v1/status/status

      - name: Stop container
        if: always()
        run: |
          docker compose logs api
          docker compose down
